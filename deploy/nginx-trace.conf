# Nginx site for Trace. Copy to /etc/nginx/sites-available/trace,
# replace yourdomain.pk (2 places), then:
#   sudo ln -s /etc/nginx/sites-available/trace /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# certbot adds the HTTPS part to this file automatically.
server {
    listen 80;
    server_name yourdomain.pk www.yourdomain.pk;

    # React build (frontend/frontend/dist)
    root /home/trace/trace/frontend/frontend/dist;
    index index.html;

    # photos up to 5 MB + form data
    client_max_body_size 16m;

    # Node backend API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # "Run AI Scan on All" can take a few minutes
        proxy_read_timeout 300s;
    }

    # Uploaded photos go through Node (it checks private photos / FIR access)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
    }

    # Share links (WhatsApp / Facebook preview) are built by Node
    location /share/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker must never be cached, so app updates reach users
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # React router: unknown paths -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built JS/CSS/images
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
